---
# The issues here are deliberate deviations from the guidelines, as flagged by the qa tooling.
# For each issue documented, a reason for deviating from the guidelines is given.

issues should occur: true

---
# The following issues are not "real" deviations stemming from design choices, but rather problems that pop up due to
# shortcomings in tooling, the used terminology server, etc.
# These might occur in one or more profiles, or in none if they have been fixed in the meantime. 

issues should occur: false

"*":
  ignored issues:
    "*.extension[*].extension[*].value.ofType(canonical)":
      - message: "The Profile 'http://hl7.org/fhir/StructureDefinition/obligation|5.3.0' definition allows for the type uri but found type canonical"
        reason: This is an error in the tooling regarding the Obligations extensions. The tooling seems to load the STU3 version of the extension, where the type shoud be uri.
      - message: "The Profile 'http://hl7.org/fhir/tools/StructureDefinition/additional-binding|1.3.0' definition allows for the type uri but found type canonical"
        reason: This is an error in the tooling regarding the Additional Binding extensions. The tooling seems to load the STU3 version of the extension, where the type shoud be uri.
    "StructureDefinition.differential.element[*].extension[*].extension[1].value.ofType(canonical)":
      - message: "A definition could not be found for Canonical URL 'http://ig.nictiz.nl/gbb/ActorDefinition/"
        reason: ActorDefinitions are normally not part of the input, they are downloaded from ART-DECOR at build time. They aren't required for succesful validation, the Validator only outputs a message, but since these messages clutter the output, the issue is suppressed here.
