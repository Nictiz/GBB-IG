name: Cleanup _generated_ branches

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  CleanupGeneratedBranches:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ secrets.FHIR_IG_ARTIFACT_GENERATOR_ID }}
        private-key: ${{ secrets.FHIR_IG_ARTIFACT_GENERATOR_PRIVATE_KEY }}
    - name: Checkout repository
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # Fetch all history for all branches and tags
        token: ${{ steps.app-token.outputs.token }}
    - name: Delete old branches
      run: |
        git fetch --prune
        git branch -r --format "%(refname:short) %(committerdate:iso8601)" --list 'origin/_generated_*' | while read branch date; do
          branch_age=$(date -d "$date" +%s)
          now=$(date +%s)
          one_day=$((60*60*24))
          if [ $(($now - $branch_age)) -gt $one_day ]; then
            echo "Deleting ${branch#origin/}"
            git push origin --delete "${branch#origin/}"
          fi
        done